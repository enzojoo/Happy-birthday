<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday, Scott</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
  :root {
    --bg: #fbf6ee;
    --ink: #3b2f2a;
    --ink-soft: #7a6a60;
    --accent: #b5543c;
    --accent-dark: #8f3f2b;
    --gold: #e9b44c;
    --line: #e8dccd;
    --c1: #fff2b8; --c2: #ffd9c7; --c3: #d9ecd2; --c4: #d4e6f5; --c5: #e6dcf3; --c6: #fbd8e2;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: "Gowun Dodum", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- 표지 ---------- */
  .hero {
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 16px;
    position: relative;
  }
  .date {
    font-family: "Gowun Batang", serif;
    letter-spacing: .35em; font-size: 14px; color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .hero h1 {
    font-family: "Gowun Batang", serif; font-weight: 700;
    font-size: clamp(40px, 9vw, 84px); line-height: 1.1;
    margin: 0 0 12px; position: relative;
  }
  .hero h1 em { font-style: normal; color: var(--accent); display: inline-block; }
  .hero h1 em span { display: inline-block; animation: pop .7s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { 0% { opacity: 0; transform: translateY(40px) scale(.4) rotate(-12deg); } 100% { opacity: 1; transform: none; } }
  .hero p.sub { font-size: 17px; color: var(--ink-soft); margin: 0 0 36px; line-height: 1.7; }

  .twinkle { position: absolute; color: var(--gold); pointer-events: none; animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1.15) rotate(45deg); } }

  .cake { width: 180px; height: 190px; margin-bottom: 28px; }
  .flame { transform-origin: 90px 52px; animation: flicker 1.2s ease-in-out infinite alternate; transition: opacity .4s, transform .4s; }
  .smoke { opacity: 0; }
  .blown .flame { opacity: 0; transform: scale(.2); animation: none; }
  .blown .smoke { animation: smoke 1.6s ease-out forwards; }
  @keyframes flicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.08, .94) rotate(3deg); } }
  @keyframes smoke { 0% { opacity: .7; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

  .btn {
    font: inherit; font-size: 17px; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 15px 30px; box-shadow: 0 6px 18px rgba(181,84,60,.28);
    transition: background .2s, transform .2s;
    position: relative; overflow: hidden;
  }
  .btn::after { /* 반짝이는 광택 */
    content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    animation: shine 2.8s ease-in-out infinite;
  }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .btn:hover { background: var(--accent-dark); transform: translateY(-2px); }
  .btn:disabled { cursor: default; opacity: .85; }
  .scroll-hint { position: absolute; bottom: 24px; font-size: 13px; color: var(--ink-soft); opacity: 0; transition: opacity .6s; }
  .opened .scroll-hint { opacity: 1; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }

  /* ---------- 조명 끄기 + 불꽃놀이 ---------- */
  .night {
    position: fixed; inset: 0; z-index: 40; pointer-events: none;
    background: radial-gradient(ellipse at 50% 120%, #2a1d4a 0%, #120d24 55%, #07050f 100%);
    opacity: 0; transition: opacity 1s ease;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 16px;
  }
  .night.on { opacity: 1; }
  .night .big {
    font-family: "Gowun Batang", serif; font-weight: 700; color: #fff7e0;
    font-size: clamp(36px, 8vw, 88px); line-height: 1.15;
    text-shadow: 0 0 12px rgba(255,214,120,.9), 0 0 36px rgba(255,170,80,.7), 0 0 80px rgba(255,120,80,.5);
    transform: scale(.6); opacity: 0; transition: transform 1.2s cubic-bezier(.2,1.4,.4,1) .5s, opacity 1s ease .5s;
  }
  .night .big small { display: block; font-size: .42em; letter-spacing: .3em; margin-top: 14px; font-weight: 400; }
  .night.on .big { transform: scale(1); opacity: 1; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 45; pointer-events: none; }

  /* ---------- 풍선 ---------- */
  .balloon { position: fixed; bottom: -160px; z-index: 46; pointer-events: none; animation: rise linear forwards; }
  .balloon svg { display: block; animation: sway 3s ease-in-out infinite alternate; transform-origin: 50% 100%; }
  @keyframes rise { to { transform: translateY(calc(-100vh - 260px)); } }
  @keyframes sway { from { transform: rotate(-7deg) translateX(-10px); } to { transform: rotate(7deg) translateX(10px); } }

  /* ---------- 음악 버튼 ---------- */
  .music {
    position: fixed; right: 16px; bottom: 16px; z-index: 60;
    width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer;
    background: #fff; color: var(--ink); font-size: 22px;
    box-shadow: 0 4px 16px rgba(59,47,42,.18);
    display: none; align-items: center; justify-content: center;
  }
  .music.show { display: flex; }
  .music.playing { animation: pulse 1.65s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 4px 16px rgba(59,47,42,.18), 0 0 0 8px rgba(181,84,60,.15); } }

  /* ---------- 메시지 ---------- */
  .board { max-width: 1120px; margin: 0 auto; padding: 24px 16px 80px; }
  .board-head { text-align: center; margin-bottom: 36px; }
  .board-head h2 { font-family: "Gowun Batang", serif; font-size: 28px; margin: 0 0 6px; }
  .board-head p { margin: 0; color: var(--ink-soft); }
  .board-head strong { color: var(--accent); }

  .cards { columns: 3 300px; column-gap: 24px; }
  .card {
    break-inside: avoid; display: block; width: 100%;
    margin: 0 0 24px; padding: 26px 24px 20px;
    border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--c, var(--c1));
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(59,47,42,.08), 0 8px 20px rgba(59,47,42,.08);
    transform: rotate(var(--r, 0deg));
    transition: transform .25s, box-shadow .25s;
    position: relative;
    opacity: 0;
  }
  .card.in { animation: flyin .8s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes flyin {
    0% { opacity: 0; transform: translateY(60px) rotate(calc(var(--r, 0deg) * -6)) scale(.7); }
    100% { opacity: 1; transform: rotate(var(--r, 0deg)); }
  }
  .card::before { /* 마스킹 테이프 */
    content: ""; position: absolute; top: -10px; left: 50%;
    width: 84px; height: 22px; margin-left: -42px;
    background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.04);
    transform: rotate(calc(var(--r, 0deg) * -2));
  }
  .card.in:hover, .card.in:focus-visible { animation: none; opacity: 1; transform: rotate(0) scale(1.03); box-shadow: 0 2px 4px rgba(59,47,42,.1), 0 16px 32px rgba(59,47,42,.14); outline: none; }
  .card .msg {
    font-family: "Nanum Pen Script", cursive; font-size: 25px; line-height: 1.35;
    white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere;
    margin: 0 0 14px;
    overflow-wrap: anywhere;
  }
  .card .from { font-family: "Nanum Pen Script", cursive; font-size: 22px; text-align: right; color: var(--ink-soft); margin: 0; }

  .empty { text-align: center; color: var(--ink-soft); padding: 40px 0; }
  .write-btn { margin-top: 18px; font-size: 16px; padding: 12px 24px; }
  .card.mine { animation: stick .9s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes stick { 0% { opacity: 0; transform: translateY(-80px) rotate(-12deg) scale(1.3); } 100% { opacity: 1; transform: rotate(var(--r, 0deg)); } }

  #writer { background: #fffdf8; }
  #writer h3 { font-family: "Gowun Batang", serif; font-size: 22px; margin: 0 0 18px; }
  #writer label { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 14px; }
  #writer input, #writer textarea {
    display: block; width: 100%; margin-top: 6px; padding: 10px 12px;
    font-family: "Nanum Pen Script", cursive; font-size: 24px; color: var(--ink);
    background: var(--c1); border: 1px solid var(--line); border-radius: 4px; resize: vertical;
  }
  #writer input:focus, #writer textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .w-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .w-count { font-size: 13px; color: var(--ink-soft); }
  .w-err { flex: 1; font-size: 13px; color: var(--accent-dark); }
  .w-foot .btn { margin-left: auto; padding: 11px 22px; font-size: 16px; }

  footer { text-align: center; padding: 0 16px 56px; color: var(--ink-soft); font-family: "Gowun Batang", serif; }
  footer .sign { font-size: 20px; color: var(--ink); margin-top: 6px; }
  footer .credit { font-family: "Gowun Dodum", sans-serif; font-size: 11px; opacity: .55; margin-top: 28px; }

  /* ---------- 크게 보기 ---------- */
  dialog {
    border: 0; padding: 40px 32px 28px; border-radius: 6px;
    width: min(560px, calc(100vw - 32px)); max-height: calc(100svh - 64px);
    background: var(--c, var(--c1)); color: var(--ink);
    box-shadow: 0 24px 60px rgba(0,0,0,.25);
  }
  dialog[open] { animation: zoom .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes zoom { from { transform: scale(.7) rotate(-3deg); opacity: 0; } }
  dialog::backdrop { background: rgba(59,47,42,.45); backdrop-filter: blur(3px); }
  dialog .msg { font-family: "Nanum Pen Script", cursive; font-size: 30px; line-height: 1.4; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; margin: 0 0 20px; }
  dialog .from { font-family: "Nanum Pen Script", cursive; font-size: 26px; text-align: right; color: var(--ink-soft); margin: 0; }
  dialog .close { position: absolute; top: 10px; right: 14px; background: none; border: 0; font-size: 26px; cursor: pointer; color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    .flame, .opened .scroll-hint, .twinkle, .btn::after, .music.playing, .hero h1 em span { animation: none; }
    .card, .card.in { opacity: 1; animation: none; }
  }

  /* ---------- 인쇄 (실물 전달용) ---------- */
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; }
    .hero { min-height: auto; padding: 0 0 10mm; }
    .btn, .write-btn, .scroll-hint, .credit, .night, #fx, .balloon, .music, .twinkle, dialog { display: none !important; }
    .cake { width: 90px; height: 95px; margin-bottom: 6mm; }
    .hero p.sub { margin-bottom: 0; }
    .board { padding: 0; }
    .cards { columns: 2; column-gap: 8mm; }
    .card { opacity: 1 !important; animation: none !important; transform: none !important; box-shadow: none; border: 1px solid #e3d6c6; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin-bottom: 8mm; }
    .card::before { display: none; }
    .card .msg { -webkit-line-clamp: unset; display: block; overflow: visible; }
    footer { padding-top: 6mm; break-inside: avoid; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <svg class="cake" viewBox="0 0 180 190" aria-hidden="true">
    <g class="smoke"><path d="M90 40 q-8 -12 0 -22 q8 -10 0 -20" fill="none" stroke="#b9ada4" stroke-width="3" stroke-linecap="round"/></g>
    <path class="flame" d="M90 30 C80 44 82 54 90 56 C98 54 100 44 90 30Z" fill="#f5a623"/>
    <rect x="86" y="56" width="8" height="30" rx="2" fill="#e8cfe0"/>
    <rect x="30" y="86" width="120" height="38" rx="8" fill="#fff" stroke="#efe2d2" stroke-width="2"/>
    <path d="M30 100 q15 14 30 0 t30 0 t30 0 t30 0" fill="none" stroke="#f3b6a3" stroke-width="6" stroke-linecap="round"/>
    <rect x="18" y="122" width="144" height="46" rx="8" fill="#b5543c"/>
    <path d="M18 138 q18 12 36 0 t36 0 t36 0 t36 0" fill="none" stroke="#fbf6ee" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    <rect x="6" y="166" width="168" height="10" rx="5" fill="#d9c7b3"/>
  </svg>
  <div class="date">2026 · 11 · 21</div>
  <h1>Happy Birthday,<br><em id="name">Scott</em></h1>
  <p class="sub">스캇님의 생신을 진심으로 축하드립니다.<br>동료들이 마음을 담아 한 장씩 적었어요.</p>
  <button class="btn" id="blow">🕯️ 촛불 끄고 편지 열기</button>
  <div class="scroll-hint">아래로 내려 보세요 ↓</div>
</section>

<main class="board" id="board">
  <div class="board-head">
    <h2>To. Scott</h2>
    <p><strong id="count">0</strong>명의 마음이 도착했어요</p>
    <button class="btn write-btn" id="writeBtn">✍️ 메시지 남기기</button>
  </div>
  <div class="cards" id="cards"></div>
</main>

<footer>
  <div>늘 감사합니다. 행복한 하루 보내세요.</div>
  <div class="sign">From. 함께 일하는 동료들 💐</div>
  <div class="credit">♪ Instrument samples: FluidR3 GM soundfont by Frank Wen (CC BY 3.0)</div>
</footer>

<div class="night" id="night" aria-hidden="true">
  <div class="big">Happy Birthday<br>Scott<small>2026 · 11 · 21</small></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="music" id="music" aria-label="배경음악 끄기/켜기">🔊</button>

<dialog id="modal">
  <button class="close" aria-label="닫기">×</button>
  <p class="msg"></p>
  <p class="from"></p>
</dialog>

<dialog id="writer">
  <button class="close" aria-label="닫기">×</button>
  <form id="writeForm" novalidate>
    <h3>스캇님께 한마디 ✍️</h3>
    <label>보내는 사람
      <input id="wName" autofocus maxlength="20" placeholder="이름" autocomplete="name" required>
    </label>
    <label>메시지
      <textarea id="wMsg" maxlength="500" rows="7" placeholder="생신 축하 메시지를 남겨 주세요" required></textarea>
    </label>
    <div class="w-foot">
      <span class="w-count"><span id="wCount">0</span>/500</span>
      <span class="w-err" id="wErr" role="alert"></span>
      <button class="btn" id="wSubmit" type="submit">붙이기 📌</button>
    </div>
  </form>
</dialog>

<script src="messages.js"></script>
<script src="music.js"></script>
<script>
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= 메시지 카드 ================= */
  // messages.js: 엔조님이 따로 받아 넣는 메시지 / Firestore: 사이트에서 직접 남긴 메시지
  const DB = "https://firestore.googleapis.com/v1/projects/enzo-784b0/databases/(default)/documents";
  const COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"];
  const ROT = [-1.6, 1.2, -0.6, 1.8, -1.1, 0.7, -1.9, 0.9];
  const cards = document.getElementById("cards");
  const countEl = document.getElementById("count");
  const shown = new Set(); // 이미 붙인 Firestore 문서 id
  let n = 0;

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.1 });

  const nameOf = m => `From. ${String(m.name || "").trim() || "익명"}`;
  function makeCard(m) {
    const i = n++;
    const card = document.createElement("button");
    card.className = "card";
    card.style.setProperty("--c", `var(${COLORS[i % COLORS.length]})`);
    card.style.setProperty("--r", `${ROT[i % ROT.length]}deg`);
    const msg = document.createElement("p"); msg.className = "msg"; msg.textContent = String(m.message).trim();
    const from = document.createElement("p"); from.className = "from"; from.textContent = nameOf(m);
    card.append(msg, from);
    card.addEventListener("click", () => openModal(m, card.style.getPropertyValue("--c")));
    return card;
  }
  function updateCount() {
    countEl.textContent = n;
    const empty = document.getElementById("empty");
    if (empty) empty.hidden = n > 0;
  }
  function addCard(m, { top = false, mine = false } = {}) {
    const card = makeCard(m);
    if (mine) card.classList.add("in", "mine");
    else { card.style.animationDelay = `${(n % 3) * 110}ms`; io.observe(card); }
    top ? cards.prepend(card) : cards.appendChild(card);
    updateCount();
    return card;
  }
  cards.insertAdjacentHTML("afterend", '<p class="empty" id="empty">아직 도착한 메시지가 없어요. 첫 번째 메시지를 남겨 주세요!</p>');

  // 1) 엔조님이 모아서 넣은 메시지
  (window.MESSAGES || []).filter(m => m && m.message && String(m.message).trim()).forEach(m => addCard(m));
  updateCount();

  // 2) 사이트에서 남긴 메시지 (최신 글이 위로, 20초마다 새 글 확인)
  const docMsg = d => ({ id: d.name.split("/").pop(), name: d.fields?.name?.stringValue, message: d.fields?.message?.stringValue, at: d.fields?.createdAt?.timestampValue || "" });
  async function loadLive() {
    try {
      let docs = [], token = "";
      do {
        const r = await fetch(`${DB}/messages?pageSize=300&orderBy=createdAt${token ? "&pageToken=" + token : ""}`);
        if (!r.ok) return;
        const j = await r.json();
        docs = docs.concat(j.documents || []); token = j.nextPageToken || "";
      } while (token);
      docs.map(docMsg).filter(m => m.message && !shown.has(m.id))
        .sort((a, b) => a.at.localeCompare(b.at))
        .forEach(m => { shown.add(m.id); addCard(m, { top: true }); });
    } catch (e) { /* 네트워크 오류 시 다음 주기에 다시 시도 */ }
  }
  loadLive();
  setInterval(loadLive, 20000);

  // 3) 메시지 남기기
  const writer = document.getElementById("writer");
  const wName = document.getElementById("wName"), wMsg = document.getElementById("wMsg");
  const wErr = document.getElementById("wErr"), wSubmit = document.getElementById("wSubmit");
  document.getElementById("writeBtn").addEventListener("click", () => { wErr.textContent = ""; writer.showModal(); });
  writer.querySelector(".close").addEventListener("click", () => writer.close());
  writer.addEventListener("click", e => { if (e.target === writer) writer.close(); });
  wMsg.addEventListener("input", () => { document.getElementById("wCount").textContent = [...wMsg.value].length; });

  document.getElementById("writeForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = wName.value.trim(), message = wMsg.value.trim();
    if (!name) { wErr.textContent = "이름을 적어 주세요."; wName.focus(); return; }
    if (!message) { wErr.textContent = "메시지를 적어 주세요."; wMsg.focus(); return; }
    if ([...name].length > 20 || [...message].length > 500) { wErr.textContent = "이름은 20자, 메시지는 500자까지 쓸 수 있어요."; return; }
    wSubmit.disabled = true; wSubmit.textContent = "붙이는 중…"; wErr.textContent = "";
    const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/[^a-zA-Z0-9]/g, "").slice(0, 20);
    try {
      const r = await fetch(`${DB}:commit`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ writes: [{
          update: { name: `projects/enzo-784b0/databases/(default)/documents/messages/${id}`,
                    fields: { name: { stringValue: name }, message: { stringValue: message } } },
          currentDocument: { exists: false },
          updateTransforms: [{ fieldPath: "createdAt", setToServerValue: "REQUEST_TIME" }],
        }] }),
      });
      if (!r.ok) throw new Error(r.status);
      shown.add(id);
      writer.close();
      wMsg.value = ""; document.getElementById("wCount").textContent = "0";
      const card = addCard({ name, message }, { top: true, mine: true });
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      if (!REDUCED) setTimeout(cannons, 400);
    } catch (err) {
      wErr.textContent = "저장하지 못했어요. 잠시 후 다시 시도해 주세요.";
    } finally {
      wSubmit.disabled = false; wSubmit.textContent = "붙이기 📌";
    }
  });

  const modal = document.getElementById("modal");
  function openModal(m, color) {
    modal.style.setProperty("--c", color);
    modal.querySelector(".msg").textContent = String(m.message).trim();
    modal.querySelector(".from").textContent = nameOf(m);
    modal.showModal();
  }
  modal.querySelector(".close").addEventListener("click", () => modal.close());
  modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });

  /* ================= 표지 장식 ================= */
  const nameEl = document.getElementById("name");
  nameEl.innerHTML = [...nameEl.textContent].map((ch, i) => `<span style="animation-delay:${0.3 + i * 0.12}s">${ch}</span>`).join("");
  const hero = document.getElementById("hero");
  [[12, 22], [86, 18], [20, 70], [80, 64], [50, 10], [8, 46], [92, 40]].forEach(([x, y], i) => {
    const s = document.createElement("span");
    s.className = "twinkle"; s.textContent = "✦";
    s.style.left = x + "%"; s.style.top = y + "%";
    s.style.fontSize = (12 + (i % 3) * 6) + "px";
    s.style.animationDelay = (i * 0.37) + "s";
    hero.appendChild(s);
  });

  /* ================= 캔버스 효과 (불꽃놀이 · 꽃가루) ================= */
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  let W = 0, H = 0;
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  resize(); addEventListener("resize", resize);

  // 주사율(60Hz/120Hz)과 무관하게 같은 속도로 움직이도록 경과 시간(k = 60fps 기준 프레임 수)으로 계산
  const parts = []; let running = false, last = 0;
  function frame(now) {
    const k = Math.min((now - last) / 16.67 || 1, 3); last = now;
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      if (!p.step(k)) { parts.splice(i, 1); continue; }
      p.draw();
    }
    if (parts.length) requestAnimationFrame(frame); else { running = false; ctx.clearRect(0, 0, W, H); }
  }
  function add(p) { parts.push(p); if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }
  const rand = (a, b) => a + Math.random() * (b - a);

  // 불꽃 파편
  function Spark(x, y, vx, vy, hue, glitter) {
    let a = 1; const decay = rand(0.011, 0.02); let px = x, py = y;
    return {
      fire: true,
      step(k) { px = x; py = y; const f = 0.975 ** k; vx *= f; vy = vy * f + 0.045 * k; x += vx * k; y += vy * k; a -= decay * k; return a > 0; },
      draw() {
        if (glitter && Math.random() < 0.35) return;
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = `hsla(${hue},100%,${glitter ? 85 : 65}%,${a})`;
        ctx.lineWidth = glitter ? 1.4 : 2.2;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
      }
    };
  }
  function explode(x, y, shape) {
    const hue = rand(0, 360), hue2 = (hue + rand(40, 140)) % 360;
    if (shape === "heart") {
      for (let i = 0; i < 90; i++) {
        const t = (i / 90) * Math.PI * 2;
        const hx = 16 * Math.sin(t) ** 3, hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        add(Spark(x, y, hx * 0.32, hy * 0.32, 345 + rand(-10, 10), false));
      }
      return;
    }
    const n = shape === "ring" ? 70 : 110;
    for (let i = 0; i < n; i++) {
      const ang = rand(0, Math.PI * 2);
      const sp = shape === "ring" ? 5.2 : rand(1, 6.5);
      add(Spark(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp, i % 2 ? hue : hue2, Math.random() < 0.3));
    }
  }
  function rocket(shape) {
    let x = rand(W * 0.15, W * 0.85), y = H + 10;
    const ty = rand(H * 0.12, H * 0.45), vx = rand(-1, 1);
    let vy = -Math.sqrt(2 * 0.12 * (y - ty)); // 정점에서 멈추도록 초속 계산
    return {
      fire: true,
      step(k) {
        x += vx * k; y += vy * k; vy += 0.12 * k;
        if (vy >= 0) { explode(x, y, shape); return false; }
        return true;
      },
      draw() {
        ctx.globalCompositeOperation = "lighter";
        ctx.fillStyle = "rgba(255,230,180,.95)";
        ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,180,90,.35)";
        ctx.beginPath(); ctx.arc(x - vx, y - vy * 1.5, 1.6, 0, Math.PI * 2); ctx.fill();
      }
    };
  }

  // 꽃가루 조각
  const CONF = ["#b5543c", "#e9b44c", "#f3b6a3", "#9cc28f", "#8fb8de", "#c3a6e3", "#ff7aa2", "#ffd54f"];
  function Confetto(x, y, vx, vy) {
    const w = rand(6, 11), h = rand(9, 16), color = CONF[Math.floor(Math.random() * CONF.length)];
    let rot = rand(0, 6.28), vr = rand(-0.2, 0.2), wob = rand(0, 6.28), vw = rand(0.08, 0.2);
    return {
      step(k) {
        const f = 0.985 ** k; vx *= f; vy = Math.min(vy * f + 0.22 * k, 4.2);
        wob += vw * k; rot += vr * k; x += (vx + Math.sin(wob) * 0.8) * k; y += vy * k;
        return y < H + 30;
      },
      draw() {
        ctx.globalCompositeOperation = "source-over";
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, Math.cos(wob));
        ctx.fillStyle = color; ctx.fillRect(-w / 2, -h / 2, w, h);
        ctx.restore();
      }
    };
  }
  function cannons() {
    for (let i = parts.length - 1; i >= 0; i--) if (parts[i].fire) parts.splice(i, 1); // 밝은 배경에 남는 불꽃 잔상 정리
    for (let i = 0; i < 140; i++) {
      add(Confetto(-10, H * 0.85, rand(6, 15), rand(-19, -9)));
      add(Confetto(W + 10, H * 0.85, -rand(6, 15), rand(-19, -9)));
    }
    for (let i = 0; i < 120; i++) add(Confetto(rand(0, W), rand(-H * 0.6, -20), rand(-1, 1), rand(1, 3)));
  }

  // 풍선
  const BALLOON = ["#e8574a", "#f2a541", "#f6d55c", "#7bc47f", "#5aa9e6", "#a685e2", "#ff8fab"];
  function balloons(n) {
    for (let i = 0; i < n; i++) {
      const b = document.createElement("div");
      const size = rand(46, 82), c = BALLOON[i % BALLOON.length];
      b.className = "balloon";
      b.style.left = rand(0, 94) + "vw";
      b.style.animationDuration = rand(6.5, 10.5) + "s";
      b.style.animationDelay = rand(0, 1.8) + "s";
      b.innerHTML = `<svg width="${size}" height="${size * 2}" viewBox="0 0 50 100" style="animation-delay:${rand(0, 2)}s">
        <path d="M25 62 q-3 12 2 22 q4 8 -1 16" fill="none" stroke="#9a8c80" stroke-width="1"/>
        <ellipse cx="25" cy="30" rx="22" ry="28" fill="${c}"/>
        <ellipse cx="17" cy="19" rx="5" ry="8" fill="#fff" opacity=".35" transform="rotate(-25 17 19)"/>
        <path d="M21 58 L29 58 L25 63 Z" fill="${c}"/></svg>`;
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 13000);
    }
  }

  /* ================= 배경음악 (오케스트라 생일 축하 노래, music.js) ================= */
  const Music = createOrchestra("sounds/");
  Music.preload(); // 샘플을 미리 받아 두어 버튼을 누르자마자 연주되게 함

  const musicBtn = document.getElementById("music");
  musicBtn.addEventListener("click", () => {
    if (Music.on) { Music.stop(); musicBtn.textContent = "🔇"; musicBtn.classList.remove("playing"); }
    else { Music.start(); musicBtn.textContent = "🔊"; musicBtn.classList.add("playing"); }
  });

  /* ================= 촛불 끄기 시퀀스 ================= */
  const night = document.getElementById("night");
  const blowBtn = document.getElementById("blow");
  let busy = false;
  blowBtn.addEventListener("click", () => {
    if (busy) return;
    busy = true; blowBtn.disabled = true;
    hero.classList.add("blown");
    if (!Music.on) { Music.start(); musicBtn.textContent = "🔊"; }
    musicBtn.classList.add("show", "playing");

    if (REDUCED) { finish(); return; }

    // 1) 조명이 꺼지고 불꽃놀이
    setTimeout(() => night.classList.add("on"), 300);
    const shapes = ["burst", "ring", "burst", "heart", "burst", "ring", "burst", "heart", "burst", "burst", "ring", "burst"];
    shapes.forEach((s, i) => setTimeout(() => add(rocket(s)), 900 + i * 420 + rand(0, 200)));
    setTimeout(() => { for (let i = 0; i < 4; i++) add(rocket(i % 2 ? "ring" : "burst")); }, 6200); // 피날레

    // 2) 조명이 켜지고 꽃가루 대포 + 풍선
    setTimeout(() => { night.classList.remove("on"); cannons(); balloons(14); }, 8200);
    setTimeout(finish, 9600);
  });
  function finish() {
    hero.classList.add("opened");
    document.getElementById("board").scrollIntoView({ behavior: "smooth" });
    blowBtn.textContent = "🎆 한 번 더 축하하기";
    setTimeout(() => { busy = false; blowBtn.disabled = false; }, 1500);
  }
</script>
</body>
</html>
