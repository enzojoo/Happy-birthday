<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday, Scott</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<style>
  :root {
    --bg: #fbf6ee;
    --ink: #3b2f2a;
    --ink-soft: #7a6a60;
    --accent: #b5543c;
    --accent-dark: #8f3f2b;
    --line: #e8dccd;
    --c1: #fff2b8; --c2: #ffd9c7; --c3: #d9ecd2; --c4: #d4e6f5; --c5: #e6dcf3; --c6: #fbd8e2;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: "Gowun Dodum", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 표지 ---------- */
  .hero {
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 16px;
    position: relative;
  }
  .date {
    font-family: "Gowun Batang", serif;
    letter-spacing: .35em; font-size: 14px; color: var(--ink-soft);
    margin-bottom: 20px;
  }
  .hero h1 {
    font-family: "Gowun Batang", serif; font-weight: 700;
    font-size: clamp(40px, 9vw, 84px); line-height: 1.1;
    margin: 0 0 12px;
  }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p.sub { font-size: 17px; color: var(--ink-soft); margin: 0 0 36px; line-height: 1.7; }

  .cake { width: 180px; height: 190px; margin-bottom: 28px; }
  .flame { transform-origin: 90px 52px; animation: flicker 1.2s ease-in-out infinite alternate; transition: opacity .4s, transform .4s; }
  .smoke { opacity: 0; }
  .blown .flame { opacity: 0; transform: scale(.2); animation: none; }
  .blown .smoke { animation: smoke 1.6s ease-out forwards; }
  @keyframes flicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.08, .94) rotate(3deg); } }
  @keyframes smoke { 0% { opacity: .7; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-40px); } }

  .btn {
    font: inherit; font-size: 17px; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 15px 30px; box-shadow: 0 6px 18px rgba(181,84,60,.28);
    transition: background .2s, transform .2s;
  }
  .btn:hover { background: var(--accent-dark); transform: translateY(-2px); }
  .scroll-hint { position: absolute; bottom: 24px; font-size: 13px; color: var(--ink-soft); opacity: 0; transition: opacity .6s; }
  .opened .scroll-hint { opacity: 1; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }

  /* ---------- 메시지 ---------- */
  .board { max-width: 1120px; margin: 0 auto; padding: 24px 16px 80px; }
  .board-head { text-align: center; margin-bottom: 36px; }
  .board-head h2 { font-family: "Gowun Batang", serif; font-size: 28px; margin: 0 0 6px; }
  .board-head p { margin: 0; color: var(--ink-soft); }
  .board-head strong { color: var(--accent); }

  .cards { columns: 3 300px; column-gap: 24px; }
  .card {
    break-inside: avoid; display: block; width: 100%;
    margin: 0 0 24px; padding: 26px 24px 20px;
    border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--c, var(--c1));
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(59,47,42,.08), 0 8px 20px rgba(59,47,42,.08);
    transform: rotate(var(--r, 0deg));
    transition: transform .25s, box-shadow .25s;
    position: relative;
    opacity: 0; translate: 0 16px;
  }
  .card.in { opacity: 1; translate: 0 0; transition: transform .25s, box-shadow .25s, opacity .6s, translate .6s; }
  .card::before { /* 마스킹 테이프 */
    content: ""; position: absolute; top: -10px; left: 50%;
    width: 84px; height: 22px; margin-left: -42px;
    background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.04);
    transform: rotate(calc(var(--r, 0deg) * -2));
  }
  .card:hover, .card:focus-visible { transform: rotate(0) scale(1.02); box-shadow: 0 2px 4px rgba(59,47,42,.1), 0 16px 32px rgba(59,47,42,.14); outline: none; }
  .card .msg {
    font-family: "Nanum Pen Script", cursive; font-size: 25px; line-height: 1.35;
    white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere;
    margin: 0 0 14px;
    display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .from { font-family: "Nanum Pen Script", cursive; font-size: 22px; text-align: right; color: var(--ink-soft); margin: 0; }

  .empty { text-align: center; color: var(--ink-soft); padding: 40px 0; }

  footer { text-align: center; padding: 0 16px 56px; color: var(--ink-soft); font-family: "Gowun Batang", serif; }
  footer .sign { font-size: 20px; color: var(--ink); margin-top: 6px; }

  /* ---------- 크게 보기 ---------- */
  dialog {
    border: 0; padding: 40px 32px 28px; border-radius: 6px;
    width: min(560px, calc(100vw - 32px)); max-height: calc(100svh - 64px);
    background: var(--c, var(--c1)); color: var(--ink);
    box-shadow: 0 24px 60px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(59,47,42,.45); backdrop-filter: blur(3px); }
  dialog .msg { font-family: "Nanum Pen Script", cursive; font-size: 30px; line-height: 1.4; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; margin: 0 0 20px; }
  dialog .from { font-family: "Nanum Pen Script", cursive; font-size: 26px; text-align: right; color: var(--ink-soft); margin: 0; }
  dialog .close { position: absolute; top: 10px; right: 14px; background: none; border: 0; font-size: 26px; cursor: pointer; color: var(--ink-soft); }

  /* ---------- 꽃가루 ---------- */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }

  @media (prefers-reduced-motion: reduce) {
    .flame, .opened .scroll-hint { animation: none; }
    .card { opacity: 1; translate: 0 0; }
  }

  /* ---------- 인쇄 (실물 전달용) ---------- */
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; }
    .hero { min-height: auto; padding: 0 0 10mm; }
    .btn, .scroll-hint, .confetti, dialog { display: none !important; }
    .cake { width: 90px; height: 95px; margin-bottom: 6mm; }
    .hero p.sub { margin-bottom: 0; }
    .board { padding: 0; }
    .cards { columns: 2; column-gap: 8mm; }
    .card { opacity: 1 !important; translate: 0 0 !important; transform: none !important; box-shadow: none; border: 1px solid #e3d6c6; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin-bottom: 8mm; }
    .card::before { display: none; }
    .card .msg { -webkit-line-clamp: unset; display: block; overflow: visible; }
    footer { padding-top: 6mm; break-inside: avoid; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <svg class="cake" viewBox="0 0 180 190" aria-hidden="true">
    <g class="smoke"><path d="M90 40 q-8 -12 0 -22 q8 -10 0 -20" fill="none" stroke="#b9ada4" stroke-width="3" stroke-linecap="round"/></g>
    <path class="flame" d="M90 30 C80 44 82 54 90 56 C98 54 100 44 90 30Z" fill="#f5a623"/>
    <rect x="86" y="56" width="8" height="30" rx="2" fill="#e8cfe0"/>
    <rect x="30" y="86" width="120" height="38" rx="8" fill="#fff"/>
    <path d="M30 100 q15 14 30 0 t30 0 t30 0 t30 0" fill="none" stroke="#f3b6a3" stroke-width="6" stroke-linecap="round"/>
    <rect x="18" y="122" width="144" height="46" rx="8" fill="#b5543c"/>
    <path d="M18 138 q18 12 36 0 t36 0 t36 0 t36 0" fill="none" stroke="#fbf6ee" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    <rect x="6" y="166" width="168" height="10" rx="5" fill="#d9c7b3"/>
  </svg>
  <div class="date">2026 · 11 · 21</div>
  <h1>Happy Birthday,<br><em>Scott</em></h1>
  <p class="sub">스캇님의 생신을 진심으로 축하드립니다.<br>동료들이 마음을 담아 한 장씩 적었어요.</p>
  <button class="btn" id="blow">🕯️ 촛불 끄고 편지 열기</button>
  <div class="scroll-hint">아래로 내려 보세요 ↓</div>
</section>

<main class="board" id="board">
  <div class="board-head">
    <h2>To. Scott</h2>
    <p><strong id="count">0</strong>명의 마음이 도착했어요</p>
  </div>
  <div class="cards" id="cards"></div>
</main>

<footer>
  <div>늘 감사합니다. 행복한 하루 보내세요.</div>
  <div class="sign">From. 함께 일하는 동료들 💐</div>
</footer>

<dialog id="modal">
  <button class="close" aria-label="닫기">×</button>
  <p class="msg"></p>
  <p class="from"></p>
</dialog>

<script src="messages.js"></script>
<script>
  const COLORS = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"];
  const ROT = [-1.6, 1.2, -0.6, 1.8, -1.1, 0.7, -1.9, 0.9];
  const list = (window.MESSAGES || []).filter(m => m && m.message && String(m.message).trim());

  const cards = document.getElementById("cards");
  document.getElementById("count").textContent = list.length;

  if (!list.length) {
    cards.outerHTML = '<p class="empty">아직 도착한 메시지가 없어요.</p>';
  }

  list.forEach((m, i) => {
    const card = document.createElement("button");
    card.className = "card";
    card.style.setProperty("--c", `var(${COLORS[i % COLORS.length]})`);
    card.style.setProperty("--r", `${ROT[i % ROT.length]}deg`);
    const msg = document.createElement("p");
    msg.className = "msg";
    msg.textContent = String(m.message).trim();
    const from = document.createElement("p");
    from.className = "from";
    from.textContent = `From. ${String(m.name || "").trim() || "익명"}`;
    card.append(msg, from);
    card.addEventListener("click", () => openModal(m, card.style.getPropertyValue("--c")));
    cards && cards.appendChild(card);
  });

  // 스크롤하면 카드가 하나씩 붙는 효과
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { threshold: 0.1 });
  document.querySelectorAll(".card").forEach((c, i) => { c.style.transitionDelay = `${(i % 3) * 80}ms`; io.observe(c); });

  // 크게 보기
  const modal = document.getElementById("modal");
  function openModal(m, color) {
    modal.style.setProperty("--c", color);
    modal.querySelector(".msg").textContent = String(m.message).trim();
    modal.querySelector(".from").textContent = `From. ${String(m.name || "").trim() || "익명"}`;
    modal.showModal();
  }
  modal.querySelector(".close").addEventListener("click", () => modal.close());
  modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });

  // 촛불 끄기
  const hero = document.getElementById("hero");
  document.getElementById("blow").addEventListener("click", function () {
    hero.classList.add("blown", "opened");
    this.textContent = "🎉 생신 축하드립니다!";
    this.disabled = true;
    confetti();
    setTimeout(() => document.getElementById("board").scrollIntoView({ behavior: "smooth" }), 1400);
  });

  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = document.createElement("div");
    box.className = "confetti";
    const palette = ["#b5543c", "#f5a623", "#f3b6a3", "#9cc28f", "#8fb8de", "#c3a6e3"];
    for (let i = 0; i < 120; i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = palette[i % palette.length];
      p.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
      p.style.animationDuration = (2.2 + Math.random() * 2) + "s";
      p.style.animationDelay = (Math.random() * 0.6) + "s";
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 5000);
  }
</script>
</body>
</html>
